            </div>
        </div>

    </div>

    <button class="catalog-btn prev" onclick="moveCatalog(-1)">‹</button>
    <button class="catalog-btn next" onclick="moveCatalog(1)">›</button>

        <span class="dot" onclick="goToCatalog(1)"></span>
        <span class="dot" onclick="goToCatalog(2)"></span>
